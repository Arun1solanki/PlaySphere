spring:
  application:
    name: playsphere-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/playsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Vivek@2786}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:cGxheXNwaGVyZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzItYnl0ZXM=}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  session:
    cookie-name: ${SESSION_COOKIE_NAME:playsphere_refresh}
    secure-cookie: ${SESSION_COOKIE_SECURE:false}
    same-site: ${SESSION_COOKIE_SAME_SITE:Strict}
    regular-login-hours: ${SESSION_REGULAR_LOGIN_HOURS:12}
    player-idle-minutes: ${SESSION_PLAYER_IDLE_MINUTES:60}
    organizer-idle-minutes: ${SESSION_ORGANIZER_IDLE_MINUTES:45}
    turf-owner-idle-minutes: ${SESSION_TURF_OWNER_IDLE_MINUTES:45}
    admin-idle-minutes: ${SESSION_ADMIN_IDLE_MINUTES:20}
    super-admin-idle-minutes: ${SESSION_SUPER_ADMIN_IDLE_MINUTES:15}
  email:
    provider: ${APP_EMAIL_PROVIDER:log}
    verification-minutes: ${EMAIL_VERIFICATION_MINUTES:30}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
    resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:60}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
      sender-name: ${BREVO_SENDER_NAME:PlaySphere}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:development}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  maps:
    provider: ${APP_MAPS_PROVIDER:nominatim}
    nominatim:
      user-agent: ${NOMINATIM_USER_AGENT:PlaySphere-Local-Development/0.1}
  seed-admin:
    enabled: ${APP_SEED_ADMIN:false}
    email: ${APP_ADMIN_EMAIL:admin@playsphere.local}
    password: ${APP_ADMIN_PASSWORD:ChangeMe@12345}
  seed-demo:
    enabled: ${APP_SEED_DEMO_ACCOUNTS:false}
    password: ${APP_DEMO_PASSWORD:Demo@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
